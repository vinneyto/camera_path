[project]
name = "camera-path-cli"
version = "0.1.0"
description = "Camera Path remote job client for local inference"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<17", "keyring>=25,<26"]

[project.scripts]
camera-path = "camera_path_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_path_cli"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
