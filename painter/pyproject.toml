[project]
name = "camera-path-painter"
version = "0.1.0"
description = "Standalone RabbitMQ worker for local 2D image generation and editing"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aio-pika>=10.1,<11",
    "pydantic>=2.13,<3",
    "python-dotenv>=1,<2",
    "pillow>=12,<14",
]

[project.optional-dependencies]
inference = [
    "torch>=2.15,<3",
    "diffusers>=0.43,<1",
    "transformers>=5.22,<6",
    "accelerate>=1.15,<2",
    "safetensors>=0.8,<1",
    "sentencepiece>=0.2,<1",
    "rembg[cpu]==2.0.87",
]

[project.scripts]
camera-path-painter = "camera_path_painter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_path_painter"]
