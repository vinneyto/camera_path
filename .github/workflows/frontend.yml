name: Frontend

on:
  pull_request:
    paths:
      - "backend/openapi.json"
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run api:check
        working-directory: frontend
      - run: npm run boundaries:check
        working-directory: frontend
      - run: npm run modules:check
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  module-map-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tools/module-map-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/tools/module-map-viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
