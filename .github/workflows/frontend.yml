name: Frontend

on:
  pull_request:
    paths:
      - "backend/openapi.json"
      - "frontend/**"
      - "rust/sift/**"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sift
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: cargo fmt --manifest-path rust/sift/Cargo.toml --check
      - run: cargo test --manifest-path rust/sift/Cargo.toml --features gpu-localization,profiling --locked
      - run: cargo clippy --manifest-path rust/sift/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: npm ci
        working-directory: frontend
      - run: npm run sift:build
        working-directory: frontend
      - run: cargo check --manifest-path rust/sift/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features wasm,profiling --locked
      - run: npm run api:check
        working-directory: frontend
      - run: npm run boundaries:check
        working-directory: frontend
      - run: npm run modules:check
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  module-map-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tools/module-map-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/tools/module-map-viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
