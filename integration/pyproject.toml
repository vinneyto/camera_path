[project]
name = "camera-path-api-contract-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
