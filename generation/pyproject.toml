[project]
name = "camera-path-generation"
version = "0.1.0"
description = "Standalone Trellis generation worker"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=10.1,<11",
    "numpy>=2,<3",
    "plyfile>=1.1,<2",
    "pydantic>=2.13.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_path_generation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
