[project]
name = "camera-path-rust-verification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pytest==8.4.2", "httpx==0.28.1", "boto3>=1.40,<2", "pika==1.3.2"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
