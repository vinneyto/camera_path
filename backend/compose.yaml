name: camera-path-dev
services:
  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: camera-path-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  rabbitmq-data:
